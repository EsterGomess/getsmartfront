services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: ideiateca-web-dev
    command: npm run dev
    restart: "no"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=${API_URL:-http://host.docker.internal:8000}
      - API_PREFIX=${API_PREFIX:-/api/v1}
      - API_CLIENT_USERNAME=${API_CLIENT_USERNAME:-}
      - API_CLIENT_PASSWORD=${API_CLIENT_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
